<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rota — İşler</title><link rel="stylesheet" href="/public/rota.css"><link rel="stylesheet" href="/public/page-shell.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/api/config.rb"></script></head><body><main class="app-shell"><aside class="sidebar"><div class="logo"><span class="brand-mark small">R</span><span>Rota</span></div><nav><a class="nav-item nav-link" data-page="plan" href="/plan"><span>▦</span> Planım</a><a class="nav-item nav-link" data-page="tasks" href="/tasks"><span>✓</span> İşler</a><a class="nav-item nav-link" data-page="program" href="/program"><span>◷</span> Programım</a><a class="nav-item nav-link" data-page="team" href="/team"><span>♧</span> Ekip</a><a class="nav-item nav-link" data-page="settings" href="/settings"><span>⚙</span> Ayarlar</a></nav><div class="sidebar-footer"><span id="user-avatar">D</span><div><b id="user-name">Kullanıcı</b><small id="user-role">Kişisel plan</small></div></div></aside><section class="workspace"><header class="topbar"><button class="mobile-menu" id="mobile-menu">☰</button><div><p class="eyebrow">İŞ YÖNETİMİ</p><h2>İşler</h2></div><button class="primary" id="new-task">+ Yeni iş</button></header><section class="view active-view"><div class="task-tabs"><button class="tab active" data-filter="open">Açık işler</button><button class="tab" data-filter="weekly">Tekrarlı işler</button><button class="tab" data-filter="done">Tamamlanan</button></div><div id="task-list" class="task-list"></div><p id="page-message" class="page-message"></p></section></section></main><dialog id="task-dialog"><form id="task-form" class="dialog-form"><div class="dialog-heading"><h3>Yeni iş</h3><button type="button" class="icon-button" id="close-dialog">×</button></div><label>Başlık<input name="title" required></label><div class="form-grid"><label>Süre (dk)<input name="duration_minutes" type="number" min="30" step="30" value="60" required></label><label>Son tarih<input name="due_date" type="date" required></label></div><label>Tekrar<select name="recurrence"><option value="once">Tek seferlik</option><option value="weekly">Haftalık</option></select></label><menu><button class="primary">Kaydet</button></menu></form></dialog><dialog id="research-dialog"><form id="research-form" class="dialog-form"><div class="dialog-heading"><div><p class="eyebrow">ARAŞTIRMA NOTU</p><h3 id="research-title">İş araştırması</h3></div><button type="button" class="icon-button" onclick="this.closest('dialog').close()">×</button></div><input id="research-task-id" type="hidden"><label>Araştırma sorusu<input name="query" required></label><div id="research-result" class="research-result"></div><menu><button class="primary">Araştır ve kaydet</button></menu></form></dialog><script type="module" src="/public/tasks-page.js"></script></body></html>
